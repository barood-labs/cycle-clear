name: Android AAB
on: { workflow_dispatch: {} }
jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run build && npx cap sync android
      - name: Build signed AAB
        env: { KS: "${{ secrets.ANDROID_KS_B64 }}", ANDROID_KS_PASS: "${{ secrets.ANDROID_KS_PASS }}", BUILD_NUMBER: "${{ github.run_number }}" }
        run: |
          set +x; echo "$KS" | base64 --decode > $RUNNER_TEMP/upload.jks; export ANDROID_KS_PATH=$RUNNER_TEMP/upload.jks
          cd android && ./gradlew --no-daemon bundleRelease; rm -f $RUNNER_TEMP/upload.jks
      - uses: actions/upload-artifact@v4
        with: { name: cycle-clear-aab, path: android/app/build/outputs/bundle/release/*.aab, retention-days: 30 }
